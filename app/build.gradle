apply plugin: 'com.android.application'

android {
    namespace = "com.AuroraByteSoftware.AuroraDMX"
    signingConfigs {
    }
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.AuroraByteSoftware.AuroraDMX"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 67
        versionName '4.7.1'
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            // Breaks loading backup files because objects change names
            //minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            //shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
    }
    productFlavors {
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace = 'com.AuroraByteSoftware.AuroraDMX'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    //  from  https://dl.google.com/dl/android/maven2/index.html
    implementation 'com.android.billingclient:billing:8.1.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.larswerkman:HoloColorPicker:1.5'
    implementation 'androidx.annotation:annotation:1.9.1'

    testImplementation 'junit:junit:4.13.2'
    // Required for instrumented tests
    androidTestImplementation 'androidx.annotation:annotation:1.9.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // Font awesome v4.5
    implementation 'ro.andob.draglinearlayout:draglinearlayout:1.1.3'
    implementation 'com.joanzapata.iconify:android-iconify-fontawesome:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // ArtNetStack as local module
    implementation project(':ArtNetStack')
}